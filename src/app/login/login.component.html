<div class="page">
  <!-- Exact reference image is used as the visual base on desktop. -->
  <div class="reference-bg" aria-hidden="true"></div>

  <!-- Functional login UI positioned over the reference card. -->
  <section class="login-card" aria-label="MediStore login">
    <div class="brand">
      <div class="brand-mark">
        <span></span>
      </div>
      <div class="brand-name">Medi<span>Store</span></div>
    </div>

    <div class="welcome">
      <h1>Welcome Back</h1>
      <p>Sign in to continue to MediStore</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="input-box" [class.error-border]="submitted && form.controls.username.invalid">
        <svg viewBox="0 0 24 24" class="input-icon">
          <path d="M20 21a8 8 0 0 0-16 0M12 13a5 5 0 1 0 0-10 5 5 0 0 0 0 10Z"
                fill="none" stroke="currentColor" stroke-width="1.7"
                stroke-linecap="round" />
        </svg>
        <input
          type="text"
          formControlName="username"
          placeholder="Email or Username"
          autocomplete="username"
        />
      </div>

      <div class="input-box password-box" [class.error-border]="submitted && form.controls.password.invalid">
        <svg viewBox="0 0 24 24" class="input-icon">
          <rect x="5" y="10" width="14" height="10" rx="2"
                fill="none" stroke="currentColor" stroke-width="1.7"/>
          <path d="M8 10V7a4 4 0 0 1 8 0v3"
                fill="none" stroke="currentColor" stroke-width="1.7"
                stroke-linecap="round"/>
        </svg>

        <input
          [type]="showPassword ? 'text' : 'password'"
          formControlName="password"
          placeholder="Password"
          autocomplete="current-password"
        />

        <button type="button" class="eye" (click)="showPassword = !showPassword">
          <svg *ngIf="!showPassword" viewBox="0 0 24 24">
            <path d="M2.5 12s3.5-5 9.5-5 9.5 5 9.5 5-3.5 5-9.5 5-9.5-5-9.5-5Z"
                  fill="none" stroke="currentColor" stroke-width="1.7"/>
            <circle cx="12" cy="12" r="2.5"
                    fill="none" stroke="currentColor" stroke-width="1.7"/>
          </svg>
          <svg *ngIf="showPassword" viewBox="0 0 24 24">
            <path d="M3 3l18 18M10.5 10.5a2 2 0 0 0 3 3"
                  fill="none" stroke="currentColor" stroke-width="1.7"
                  stroke-linecap="round"/>
            <path d="M6.7 6.8C4.2 8.2 2.5 10.5 2.5 12c0 0 3.5 5 9.5 5 1.7 0 3.3-.4 4.7-1"
                  fill="none" stroke="currentColor" stroke-width="1.7"
                  stroke-linecap="round"/>
          </svg>
        </button>
      </div>

      <div class="options">
        <label class="remember">
          <input type="checkbox" formControlName="remember" />
          <span class="box"></span>
          <span>Remember me</span>
        </label>

        <button type="button" class="link">Forgot password?</button>
      </div>

      <button type="submit" class="sign-in">Sign In</button>
    </form>

    <div class="divider">
      <span></span><b>or</b><span></span>
    </div>

    <div class="contact">
      <span>Don’t have an account?</span>
      <button type="button" class="link">Contact Admin</button>
    </div>
  </section>
</div>
