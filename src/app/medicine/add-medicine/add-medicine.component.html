<div class="modal-overlay" (click)="closeModal()">
  <div class="medicine-modal" (click)="$event.stopPropagation()">
    <!-- HEADER -->

    <div class="modal-header">
      <h2>Add Medicine</h2>

      <button type="button" class="close-btn" (click)="closeModal()">×</button>
    </div>

    <!-- FORM -->

    <form class="medicine-form" (ngSubmit)="saveMedicine()">
      <!-- ROW 1 -->

      <div class="form-group">
        <label> Medicine Name <span>*</span> </label>

        <input
          type="text"
          [(ngModel)]="medicine.medicineName"
          name="medicineName"
          placeholder="Enter medicine name"
        />
      </div>

      <div class="form-group">
        <label> Brand Name <span>*</span> </label>

        <input
          type="text"
          [(ngModel)]="medicine.brandName"
          name="brandName"
          placeholder="Enter brand name"
        />
      </div>

      <div class="form-group">
        <label> Generic Name </label>

        <input
          type="text"
          [(ngModel)]="medicine.genericName"
          name="genericName"
          placeholder="Enter generic name"
        />
      </div>

      <!-- ROW 2 -->

      <div class="form-group">
        <label> Category <span>*</span> </label>

        <select [(ngModel)]="medicine.category" name="category">
          <option value="">Select category</option>

          @for (category of categories; track category) {
            <option [value]="category">
              {{ category }}
            </option>
          }
        </select>
      </div>

      <div class="form-group">
        <label> Medicine Type <span>*</span> </label>

        <select [(ngModel)]="medicine.medicineType" name="medicineType">
          <option value="">Select type</option>

          @for (type of medicineTypes; track type) {
            <option [value]="type">
              {{ type }}
            </option>
          }
        </select>
      </div>

      <div class="form-group">
        <label> Composition </label>

        <input
          type="text"
          [(ngModel)]="medicine.composition"
          name="composition"
          placeholder="Enter composition"
        />
      </div>

      <!-- ROW 3 -->

      <div class="form-group">
        <label> Dosage </label>

        <input
          type="text"
          [(ngModel)]="medicine.dosage"
          name="dosage"
          placeholder="Enter dosage"
        />
      </div>

      <div class="form-group">
        <label> Strength </label>

        <input
          type="text"
          [(ngModel)]="medicine.strength"
          name="strength"
          placeholder="Enter strength"
        />
      </div>

      <div class="form-group">
        <label> Unit </label>

        <select [(ngModel)]="medicine.unit" name="unit">
          <option value="">Select unit</option>

          @for (unit of units; track unit) {
            <option [value]="unit">
              {{ unit }}
            </option>
          }
        </select>
      </div>

      <!-- ROW 4 -->

      <div class="form-group">
        <label> Batch Number <span>*</span> </label>

        <input
          type="text"
          [(ngModel)]="medicine.batchNumber"
          name="batchNumber"
          placeholder="Enter batch number"
        />
      </div>

      <div class="form-group">
        <label> Mfg. Date <span>*</span> </label>

        <input
          type="date"
          [(ngModel)]="medicine.manufacturingDate"
          name="manufacturingDate"
        />
      </div>

      <div class="form-group">
        <label> Expiry Date <span>*</span> </label>

        <input
          type="date"
          [(ngModel)]="medicine.expiryDate"
          name="expiryDate"
        />
      </div>

      <!-- ROW 5 -->

      <div class="form-group">
        <label> Purchase Price (₹) <span>*</span> </label>

        <input
          type="number"
          [(ngModel)]="medicine.purchasePrice"
          name="purchasePrice"
          placeholder="0.00"
          min="0"
        />
      </div>

      <div class="form-group">
        <label> Selling Price (₹) <span>*</span> </label>

        <input
          type="number"
          [(ngModel)]="medicine.sellingPrice"
          name="sellingPrice"
          placeholder="0.00"
          min="0"
        />
      </div>

      <div class="form-group">
        <label> GST % </label>

        <select [(ngModel)]="medicine.gst" name="gst">
          <option value="">Select GST</option>

          @for (gst of gstOptions; track gst) {
            <option [value]="gst">
              {{ gst }}
            </option>
          }
        </select>
      </div>

      <!-- ROW 6 -->

      <div class="form-group">
        <label> Stock Quantity <span>*</span> </label>

        <input
          type="number"
          [(ngModel)]="medicine.stockQuantity"
          name="stockQuantity"
          placeholder="0"
          min="0"
        />
      </div>

      <div class="form-group">
        <label> Minimum Stock Level <span>*</span> </label>

        <input
          type="number"
          [(ngModel)]="medicine.minimumStockLevel"
          name="minimumStockLevel"
          placeholder="0"
          min="0"
        />
      </div>

      <div class="form-group">
        <label> Storage Location </label>

        <input
          type="text"
          [(ngModel)]="medicine.storageLocation"
          name="storageLocation"
          placeholder="Enter location"
        />
      </div>

      <!-- NOTES -->

      <div class="form-group full-width">
        <label> Notes </label>

        <textarea
          [(ngModel)]="medicine.notes"
          name="notes"
          placeholder="Enter notes (optional)"
          rows="3"
        ></textarea>
      </div>

      <!-- FOOTER -->

      <div class="modal-footer">
        <button type="button" class="cancel-btn" (click)="closeModal()">
          Cancel
        </button>

        <button type="submit" class="save-btn">Save Medicine</button>
      </div>
    </form>
  </div>
</div>
